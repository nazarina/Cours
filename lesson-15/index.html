<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проект "Geometry Dash" — Кот и Код</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --soft-blue: #fff0f3;
            --accent-color: #008080;
            --deep-accent: #800000;
            --white: #ffffff;
            --text-main: #4a4a4a;
        }
        body { 
            background-color: var(--soft-blue); 
            font-family: sans-serif; 
            color: var(--text-main); 
        }
        .banner {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid var(--accent-color);
        }
        .frame-container {
            background: var(--white);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .lesson-frame {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 12px;
        }
        .section-title { 
            font-weight: 800; 
            color: var(--deep-accent); 
            margin: 30px 0 15px; 
            text-transform: uppercase; 
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <div class="banner">
            <span class="text-4xl">🚀</span>
            <h1 class="text-3xl md:text-4xl font-black text-teal-900 mt-2">Проект "Geometry Dash"</h1>
        </div>

        <h2 class="section-title">📺 Рабочая область урока</h2>
        <div class="frame-container">
            <iframe class="lesson-frame" src="about:blank" title="Фрейм урока Geometry Dash"></iframe>
        </div>
    </div>
</body>
</html>
